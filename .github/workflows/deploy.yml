name: Deploy to Azure (team.amalor.ai)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: swa-team
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment token
        id: token
        env:
          T: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: if [ -n "$T" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No token yet - run infra/setup-azure.ps1 first. Skipping deploy."; fi
      - name: Collect published files (the built site only, no sources)
        if: steps.token.outputs.ok == 'true'
        run: rsync -a --exclude '.git' --exclude '.github' --exclude 'src' --exclude 'infra' --exclude 'README.md' --exclude '__pycache__' ./ _site/
      - name: Deploy to Azure Static Web Apps
        if: steps.token.outputs.ok == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          output_location: ''
          skip_app_build: true
